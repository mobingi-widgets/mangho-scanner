<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>망호 스캐너</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="expanded">
<div id="root">
  <div class="head">
    <span id="role" class="pill role hit tipm">모</span>
    <span class="pill tab hit tipm on" data-kind="normal"><span class="ic"></span>망호 <span class="cnt num">–</span><span class="chev"></span></span>
    <span class="pill tab hit tipm" data-kind="sub"><span class="ic"></span>잠망호 <span class="cnt num">–</span><span class="chev"></span></span>
    <span id="modepill" class="pill">창 모드</span>
    <span id="menu" class="pill grip hit" title="메뉴">☰</span>
  </div>
  <div id="updpill" class="updpill hit" hidden></div>
  <div class="panel" id="panel">
    <div id="list" class="list"><div class="empty">읽는 중…</div></div>
  </div>
  <div id="sizer" title="끌기: 최대 높이 · 두 번 클릭: 제한 없음"><i class="grab hit"></i></div>
  <div id="wsizer" class="tipm"><i class="grab hit"></i></div>
  <div id="wlabel" hidden></div>
</div>
<template id="empty-normal">
  <div class="empty empty-state">
    <svg viewBox="0 0 154 53" aria-hidden="true" focusable="false">
      <path d="M 13 44 H 35 M 47 51 H 72 M 88 42 H 106 M 116 36 H 141 M 126 46 H 148"
            fill="none" stroke="#3f4651" stroke-width=".9" stroke-linecap="round"/>
      <path d="M 23 29 L 96 16 115 23 V 28 L 44 42 23 34 Z
               M 44 37 L 49 36 V 49 L 44 50 Z M 72 32 L 76 31 V 44 L 72 45 Z
               M 111 24 L 115 23 V 36 L 111 37 Z" fill="currentColor"/>
      <path d="M 30 18 Q 47 24 63 13 Q 79 18 96 8"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 30 16 V 28 M 63 11 V 22 M 96 6 V 17 M 46 30 V 40 M 113 17 V 31"
            stroke="currentColor" stroke-width="3.6"/>
    </svg>
    <span>부두가 비어 있습니다..</span>
  </div>
</template>
<template id="empty-sub">
  <div class="empty empty-state">
    <svg viewBox="0 0 154 53" aria-hidden="true" focusable="false">
      <path d="M 24 37 H 49 M 105 37 H 130 M 38 45 H 58 M 96 45 H 116"
            fill="none" stroke="#454d58" stroke-linecap="round"/>
      <g transform="translate(77 34) rotate(-5.7)" fill="currentColor">
        <path d="M -17 -5 Q -27 -3 -23 4 Q -19 11 0 11 T 23 4 Q 27 -3 17 -5
                 L 11 -6 8 -17 Q 7 -20 4 -20 H -4 Q -7 -20 -8 -17 L -11 -6 Z"/>
        <path d="M 0 -31 L 4.5 -27 1.3 -24.2 V -19 H -1.3 V -24.2 L -4.5 -27 Z"/>
      </g>
    </svg>
    <span>물밑도 잠잠합니다..</span>
  </div>
</template>
<script src="hitrects.js"></script>
<script src="renderer.js"></script>
</body>
</html>
