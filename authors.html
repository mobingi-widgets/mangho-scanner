<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>차단·메모 관리</title>
<link rel="stylesheet" href="authors.css">
</head>
<body>
<!-- the list (authors-ui.js open) -->
<div id="card" hidden>
  <div class="top">
    <h1>차단·메모 관리</h1>
    <button id="x" class="x" title="닫기">×</button>
  </div>
  <form id="addform" class="add">
    <input id="addtext" type="text" maxlength="64" placeholder="아이디 또는 IP 대역 (예: 223.38)" autocomplete="off" spellcheck="false">
    <button id="add" class="primary" type="submit">안 보기 등록</button>
  </form>
  <div id="head" class="row head">
    <label class="sel"><input id="all" type="checkbox" title="전체 선택"></label>
    <span class="who">작성자</span>
    <span class="memo">메모</span>
    <span class="hide">안 보기</span>
  </div>
  <div id="list" class="list"></div>
  <p id="empty" class="empty" hidden>등록한 작성자가 없습니다. 목록의 작성자를 우클릭하거나 위에 아이디·IP 대역을 넣어 등록합니다.</p>
  <p id="say" class="say"></p>
  <div class="foot">
    <button id="unhide" class="ghost" disabled>안 보기 해제</button>
    <button id="del" class="ghost" disabled>삭제</button>
    <span class="grow"></span>
    <button id="export" class="ghost">내보내기</button>
    <button id="import" class="ghost">불러오기</button>
  </div>
</div>
<!-- the 유동 band warning: in the list's own card (#warn) or as a window of its own (#confirm=...) -->
<div id="warn" class="warn" hidden>
  <h2>유동 IP 대역 숨기기</h2>
  <p id="warntext"></p>
  <div class="foot">
    <span class="grow"></span>
    <button id="warnno" class="ghost">취소</button>
    <button id="warnyes" class="primary danger">숨기기</button>
  </div>
</div>
<script src="authors.js"></script>
</body>
</html>
