<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>망호 스캐너 툴팁</title>
<style>
  /* the box's size must not depend on the window's: width = its own content (capped),
     otherwise sizing the window to the box re-wraps the text and the two chase each other */
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 700 11px/1.35 "Malgun Gothic", "Segoe UI", system-ui, sans-serif; color: #e7e3da; user-select: none; }
  #tip {
    position: absolute; left: 0; top: 0; width: max-content; max-width: 300px; padding: 6px 8px; border-radius: 9px;
    background: rgba(14, 17, 22, .94); border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .t { color: #fff; font-size: 11.5px; margin-bottom: 3px; display: flex; gap: 6px; align-items: baseline; }
  .t .main { white-space: normal; }
  .t .sub { color: #9aa0ad; font-size: 10px; font-weight: 400; white-space: nowrap; }
  table { border-collapse: collapse; }
  td { padding: 0 5px 0 0; white-space: nowrap; }
  .kv td:first-child { color: #9aa0ad; font-weight: 400; padding-right: 10px; }
  .good { color: #4fd68f; } .dim { color: #9aa0ad; } .bad { color: #ff6b5e; } .other { color: #a58be6; }
  .line { white-space: pre-wrap; margin-top: 2px; }
  .note { color: #9aa0ad; font-weight: 400; font-size: 10px; margin-top: 3px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="tip"></div>
<script src="tip.js"></script>
</body>
</html>
