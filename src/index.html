<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>망호 스캐너</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shared/lock.css">
</head>
<body class="expanded">
<div id="area"></div>
<div id="root">
  <div class="head">
    <span id="role" class="pill role hit tipm">모</span>
    <span class="pill tab hit tipm on" data-kind="normal"><span class="ic"></span>망호 <span class="cnt num">–</span><span class="chev"></span></span>
    <span class="pill tab hit tipm" data-kind="sub"><span class="ic"></span>잠망호 <span class="cnt num">–</span><span class="chev"></span></span>
    <span id="modepill" class="pill">창 모드</span>
    <span id="menu" class="pill grip hit" title="메뉴">☰</span>
  </div>
  <div id="updpill" class="updpill hit" hidden></div>
  <div class="panel" id="panel">
    <div id="list" class="list"><div class="empty">읽는 중…</div></div>
  </div>
  <div id="sizer" title="끌기: 최대 높이 · 두 번 클릭: 제한 없음"><i class="grab hit"></i></div>
  <div id="wsizer" class="tipm"><i class="grab hit"></i></div>
  <div id="wsizer2" class="tipm"><i class="grab hit"></i></div>
  <div id="wlabel" hidden></div>
</div>
<!-- 잠금 때 매우 작게: the newest 모집 중 post, while locked (renderer.js drawTile) -->
<div id="tile" data-lock-compact="흔들어 해제"><div class="tc" data-lock-fade></div></div>
<template id="empty-tab">
  <div class="empty empty-state">
    <svg viewBox="0 0 154 59" aria-hidden="true" focusable="false">
      <defs>
        <g id="empty-tab-symbol" fill="currentColor" fill-rule="evenodd"></g>
        <clipPath id="empty-tab-left">
          <path d="M -2 -2 H 12 L 12.7 3 11.4 7 13 9.7 11 12.6 12.2 20 H -2 Z"/>
        </clipPath>
        <clipPath id="empty-tab-right">
          <path d="M 26 -2 H 12 L 12.7 3 11.4 7 13 9.7 11 12.6 12.2 20 H 26 Z"/>
        </clipPath>
        <linearGradient id="empty-tab-water" x1="0%" x2="0%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#151a21" stop-opacity=".32"/>
          <stop offset="100%" stop-color="#151a21" stop-opacity=".84"/>
        </linearGradient>
      </defs>
      <g transform="translate(69 30) rotate(20) scale(3.8) translate(-12 -9)">
        <use href="#empty-tab-symbol" clip-path="url(#empty-tab-left)"/>
      </g>
      <g transform="translate(85 34) rotate(-24) scale(3.8) translate(-12 -9)">
        <use href="#empty-tab-symbol" clip-path="url(#empty-tab-right)"/>
      </g>
      <path d="M 13 43 Q 22 41 31 43 T 49 43 67 43 85 43 103 43 121 43 139 43 H 143 V 59 H 13 Z"
            fill="url(#empty-tab-water)"/>
      <path d="M 12 43 Q 17 42 22 43 T 32 43 M 103 43 Q 108 42 113 43 T 123 43
               M 130 43 H 143 M 20 50 H 39 M 104 53 H 131 M 66 48 H 75"
            fill="none" stroke="#525b68" stroke-width="1.1" stroke-linecap="round"/>
      <g fill="none" stroke="#66707d">
        <circle cx="82" cy="34" r="1.7"/>
        <circle cx="86" cy="28" r="1.2"/>
      </g>
    </svg>
    <span></span>
  </div>
</template>
<script src="shared/hitrects.js"></script>
<script src="renderer.js"></script>
<script src="shared/fade-ui.js"></script>
<script src="shared/lock-ui.js" data-bound=".head, #updpill, #panel, #tile" data-small="#menu" data-button=".head"></script>
</body>
</html>
